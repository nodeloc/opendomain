<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Lost in orbit · Yunamo</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  /* Self-host Geist from /fonts (see ../fonts) or let the system stack take over. */
  @font-face{font-family:Geist;src:url(/fonts/Geist-Black.ttf) format("truetype");font-weight:900;font-display:swap}
  @font-face{font-family:Geist;src:url(/fonts/Geist-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
  @font-face{font-family:"Geist Mono";src:url(/fonts/GeistMono-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0a0b0d;color:#ededed;font-family:Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden}
  header{padding:16px 24px}
  header img{height:30px;display:block}
  main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 16px 220px;gap:20px;overflow:hidden}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;z-index:0}
  main > *:not(.bg){position:relative;z-index:1}
  .code{font-family:"Geist Mono",monospace;font-size:14px;letter-spacing:.1em;color:#3ee6b4}
  h1{margin:0;font-weight:900;font-size:clamp(56px,12vw,160px);line-height:.9;letter-spacing:-.05em;text-transform:uppercase}
  h1 span{color:#3ee6b4}
  p{margin:0;max-width:480px;font-size:18px;line-height:28px;color:#9aa0a8}
  .host{font-family:"Geist Mono",monospace;color:#ededed}
  .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
  a.btn{display:inline-block;padding:12px 22px;border-radius:10px;font-weight:700;text-decoration:none}
  a.primary{background:#3ee6b4;color:#04110c}a.primary:hover{background:#8ff2d3}
  a.ghost{border:1px solid #2a2e35;color:#ededed}a.ghost:hover{background:#1a1d21}
</style>
</head>
<body>
<header><a href="/"><img src="/brand/yunamo-logo.svg" alt="Yunamo"></a></header>
<main>
  <img class="bg" src="/brand/planet-horizon-2880x1800.jpg" alt="" aria-hidden="true">
  <div class="code">ERROR 404</div>
  <h1>Lost in <span>orbit.</span></h1>
  <p>Nothing lives at <span class="host" id="host">this address</span> yet. If it's your subdomain, add a DNS record in the dashboard.</p>
  <div class="row">
    <a class="btn primary" href="https://yunamo.com/dashboard">Open dashboard</a>
    <a class="btn ghost" href="https://yunamo.com">Claim a name</a>
  </div>
</main>
<script>
  try { document.getElementById('host').textContent = location.host + location.pathname; } catch (e) {}
</script>
</body>
</html>
